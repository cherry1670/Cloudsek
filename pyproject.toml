[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.main]
persistent = false
ignore = [".venv"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "broad-exception-caught",
  "duplicate-code",
  "global-statement",
  "invalid-name",
]

